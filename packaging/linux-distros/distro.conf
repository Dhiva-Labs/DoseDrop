# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (tools/build_deb.sh).

NAME=dosedrop                # package name, the same as the .deb's
APP_NAME=DoseDrop            # AppImage file name
GITHUB_REPO=Dhiva-Labs/DoseDrop
TAG_PREFIX=v                 # release tags are v1.2.3
SUMMARY='Medication and water reminders that nag until you confirm'
DESCRIPTION='Escalating dose reminders with Taken / Snooze / Skip actions, full-screen alarms, interval water reminders with a daily goal, and adherence history with streaks and weekly charts. Lives in the system tray; optional start-at-login.'
MAINTAINER='Dhiva Labs <dhivakar101010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/DoseDrop
# Free to use, not open source: the .deb's copyright file
# (/usr/share/doc/dosedrop/copyright, in every package) says so.
LICENSE=LicenseRef-proprietary
LICENSE_FILE=''

# Files of the .deb tree that the other formats leave out. libdartjni.so
# comes from the jni plugin (an Android dependency); CMake builds it only
# when the build machine has a JDK, as the CI runners do, and it links that
# machine's libjvm.so by absolute path. Nothing loads it on desktop Linux,
# and shipping it would make the rpm require a JVM.
EXCLUDE=(usr/lib/dosedrop/lib/libdartjni.so)

# rpm: shared-library dependencies are worked out from the ELF files (GTK 3,
# and libayatana-appindicator3 for the tray icon). The Flutter engine also
# dlopens EGL and GLES 2 (libepoxy), which no ELF file lists, and aborts
# without them, so they are named here as rpm soname capabilities. aplay
# plays the alarm sound, as the .deb's alsa-utils dependency says.
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)' /usr/bin/aplay)
# Arch: package names, written by hand (Arch has no soname dependencies for
# most libraries). CI's ldd check on archlinux:latest keeps this honest;
# libglvnd is the dlopened EGL/GLES 2. The tray plugin also links
# libayatana-indicator3 and libayatana-ido3 itself (Ubuntu's
# ayatana-appindicator3 .pc file adds them), which Arch's
# libayatana-appindicator no longer pulls in.
ARCH_DEPENDS=(gtk3 libglvnd libayatana-appindicator libayatana-indicator ayatana-ido alsa-utils)
ARCH_INDEPENDENT=0

# AppImage (GUI apps): paths relative to the installed tree.
APPIMAGE=1
EXEC=usr/lib/dosedrop/dose_drop
DESKTOP=usr/share/applications/dosedrop.desktop
ICON=usr/share/icons/hicolor/256x256/apps/dosedrop.png
APPRUN_ENV=''                # /usr/bin/dosedrop only execs the binary
# What the AppImage and the Flatpak carry, copied from the build machine
# (see pack.sh): the tray icon's libraries, which many desktops and the
# GNOME runtime do not have, and aplay, the alarm player.
BUNDLE_LIBS=(libayatana-appindicator3.so.1 libayatana-indicator3.so.7
             libayatana-ido3-0.4.so.0 libdbusmenu-glib.so.4 libdbusmenu-gtk3.so.4)
BUNDLE_BINS=(aplay)
# Host libraries the AppImage relies on besides GTK 3 (Fedora names,
# installed for the AppImage check): EGL and GLES 2, and ALSA's libasound
# for aplay, which every desktop has but a minimal container does not.
APPIMAGE_HOST_PKGS='libglvnd-egl libglvnd-gles alsa-lib'

# Smoke tests run in each distribution container by verify.sh.
GUI_CMD=dosedrop             # must still be running after SMOKE_SECONDS under Xvfb
SMOKE_SECONDS=20
# The same proof as the .deb smoke run: the window title the Dart code sets
# (the native runner calls it dose_drop), and the data folder path_provider
# creates at start-up (a `find -path` pattern under $HOME).
SMOKE_WINDOW='^DoseDrop$'
SMOKE_DATA_PATH='.local/share/com.dhivalabs.dose_drop'
# The alarm player the packages depend on, on the app's own alarm sound
# (ALSA's null device: the containers have no sound card).
SMOKE_CMD='aplay -D null /usr/lib/dosedrop/data/flutter_assets/assets/sounds/alarm.wav'
