name: Desktop builds

# Builds, tests and packages the Linux and Windows desktop apps for x64 and
# arm64, each on a native runner: Flutter cannot cross-compile either desktop
# target, so every architecture is built on a machine of that architecture.
# The snap jobs build the amd64 and arm64 snaps the same way.
#
# The Linux .deb is then repackaged as .rpm (Fedora, RHEL, openSUSE), Arch
# package, AppImage and Flatpak, and an AUR PKGBUILD, each installed and run
# on its distribution.
#
# Every run keeps the packages as workflow artifacts. When a GitHub release is
# published, the release job attaches the tarballs, .debs, Windows zips and
# other-distribution packages of both architectures that the release does
# not already carry.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Flutter release DoseDrop is developed with. There are no Flutter SDK
  # archives for linux-arm64 or windows-arm64, so every leg installs the SDK
  # the same way: a shallow clone of the release tag.
  FLUTTER_VERSION: '3.44.6'

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    env:
      BUNDLE: build/linux/${{ matrix.arch }}/release/bundle
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # libayatana-appindicator3-dev: tray_manager's CMake aborts without it.
      # python3-pil: tools/build_deb.sh renders the hicolor icons.
      # xvfb, xauth, xdotool, dbus-x11: the smoke run of the installed .deb.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev \
            python3-pil file xvfb xauth xdotool dbus-x11

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build linux --release

      - name: Assert every ELF file in the bundle is ${{ matrix.elf_machine }}
        run: |
          for f in dose_drop lib/libapp.so lib/libflutter_linux_gtk.so; do
            [ -f "$BUNDLE/$f" ] || { echo "::error::missing $BUNDLE/$f"; exit 1; }
          done
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            echo "$f: $desc"
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE"; bad=1 ;;
            esac
          done < <(find "$BUNDLE" -type f -print0)
          echo "checked $checked ELF files"
          [ "$checked" -ge 3 ] && [ "$bad" -eq 0 ]

      - name: Package tarball and .deb
        run: |
          tools/build_tarball.sh dist
          tools/build_deb.sh dist

      - name: Check the packages
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          TARBALL="dist/DoseDrop-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          DEB="dist/dosedrop_${VERSION}-1_${{ matrix.deb_arch }}.deb"
          ls -l dist
          [ "$(ls dist | wc -l)" -eq 2 ]
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP"
          file "$RUNNER_TEMP/DoseDrop-${VERSION}-linux-${{ matrix.arch }}/dose_drop" | grep "$ELF_MACHINE"
          dpkg-deb --info "$DEB"
          [ "$(dpkg-deb --field "$DEB" Architecture)" = "${{ matrix.deb_arch }}" ]
          sudo apt-get install -y "./$DEB"
          file /usr/lib/dosedrop/dose_drop | grep "$ELF_MACHINE"

      # Starts the installed app under Xvfb and waits for the window title the
      # Dart code sets ("DoseDrop"; the native runner names it "dose_drop"),
      # which proves the AOT snapshot runs on this architecture.
      - name: Smoke-run the installed app (Xvfb)
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/smoke.log"
          dosedrop > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if xdotool search --name '^DoseDrop$' > /dev/null 2>&1; then
              echo "DoseDrop window is up after ${i}s"
              sleep 5
              kill -0 "$pid" || { echo "dosedrop died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "dosedrop exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no DoseDrop window after 90s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            pe_machine: '0x8664'
            elf_machine: '0x3E'
          - arch: arm64
            runner: windows-11-arm
            pe_machine: '0xAA64'
            elf_machine: '0xB7'
    defaults:
      run:
        shell: pwsh
    env:
      ARCH: ${{ matrix.arch }}
      RELEASE_DIR: build\windows\${{ matrix.arch }}\runner\Release
      # PE COFF machine of every .exe/.dll, and ELF e_machine of the AOT
      # snapshot (data\app.so is an ELF file on Windows too).
      PE_MACHINE: ${{ matrix.pe_machine }}
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # On an ARM64 host (PROCESSOR_ARCHITECTURE=ARM64) the bootstrap fetches
      # the arm64 Dart SDK and `flutter build windows` targets windows-arm64.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\flutter\bin"

      - name: Configure Flutter
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          flutter config --no-analytics --enable-windows-desktop
          flutter precache --windows
          flutter --version
          dart --version

      - name: Show the Visual Studio C++ components
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property displayName
          foreach ($c in 'VC.Tools.x86.x64', 'VC.Tools.ARM64', 'VC.ATL', 'VC.ATL.ARM64') {
            $path = & $vswhere -latest -products * -requires "Microsoft.VisualStudio.Component.$c" -property installationPath
            '{0,-20} {1}' -f $c, ($(if ($path) { 'installed' } else { 'missing' }))
          }

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build windows --release

      - name: Assert every PE file is ${{ matrix.pe_machine }}
        run: |
          function Get-PeMachine([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "$Path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          $files = Get-ChildItem -Path $env:RELEASE_DIR -Recurse -File -Include *.exe, *.dll
          if (-not ($files.Name -contains 'dose_drop.exe') -or -not ($files.Name -contains 'flutter_windows.dll')) {
            throw "dose_drop.exe or flutter_windows.dll missing from $env:RELEASE_DIR"
          }
          $bad = 0
          foreach ($f in $files) {
            $m = Get-PeMachine $f.FullName
            '{0,-50} 0x{1:X4}' -f $f.Name, $m
            if ($m -ne $expected) { Write-Host "::error file=$($f.FullName)::machine 0x$('{0:X4}' -f $m), expected $env:PE_MACHINE"; $bad++ }
          }
          $bytes = [IO.File]::ReadAllBytes("$env:RELEASE_DIR\data\app.so")
          $elf = [BitConverter]::ToUInt16($bytes, 0x12)
          'data\app.so ELF e_machine 0x{0:X2}' -f $elf
          if ($elf -ne [Convert]::ToUInt16($env:ELF_MACHINE, 16)) { Write-Host "::error::app.so is not $env:ELF_MACHINE"; $bad++ }
          "checked $($files.Count) PE files and app.so"
          if ($bad) { exit 1 }

      # The window title is "DoseDrop" from the native runner already, so the
      # data folder that the Dart code creates on start-up is what shows the
      # AOT snapshot actually ran.
      - name: Smoke-run the release build
        timeout-minutes: 5
        run: |
          $dataDir = Join-Path $env:APPDATA 'Dhiva Labs\DoseDrop'
          if (Test-Path $dataDir) { Remove-Item -Recurse -Force $dataDir }
          $p = Start-Process -FilePath "$env:RELEASE_DIR\dose_drop.exe" -PassThru
          $up = $false
          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { throw "dose_drop.exe exited early with code $($p.ExitCode)" }
            if ($p.MainWindowHandle -ne 0 -and (Test-Path $dataDir)) {
              "window '$($p.MainWindowTitle)' is up after ${i}s; data folder $dataDir exists"
              $up = $true
              break
            }
          }
          if (-not $up) {
            Stop-Process -Id $p.Id -Force
            throw "no window or data folder after 90 s (window handle $($p.MainWindowHandle), data folder exists: $(Test-Path $dataDir))"
          }
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw "dose_drop.exe died after showing its window (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Package zip and MSIX
        run: ./tools/package_windows.ps1 -OutDir dist

      - name: Check the packages
        run: |
          function Get-PeMachine([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "$Path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value -split '\+')[0]
          $zipName = "DoseDrop-$version-windows-$env:ARCH"
          $msixName = if ($env:ARCH -eq 'x64') { 'DoseDrop' } else { "DoseDrop-$env:ARCH" }
          Get-ChildItem dist | Format-Table Name, Length
          if ((Get-ChildItem dist).Count -ne 2) { throw 'expected exactly one zip and one msix in dist' }

          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\$zipName.zip"))
          try {
            $entry = $zip.GetEntry("$zipName/dose_drop.exe")
            if (-not $entry) { throw "$zipName/dose_drop.exe not in the zip" }
            $tmp = Join-Path $env:RUNNER_TEMP 'zip_dose_drop.exe'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $tmp, $true)
            $m = Get-PeMachine $tmp
            'zip: {0} entries, dose_drop.exe 0x{1:X4}' -f $zip.Entries.Count, $m
            if ($m -ne $expected) { throw 'zip holds the wrong architecture' }
          } finally { $zip.Dispose() }

          $msix = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\$msixName.msix"))
          try {
            $reader = New-Object IO.StreamReader($msix.GetEntry('AppxManifest.xml').Open())
            $manifest = [xml]$reader.ReadToEnd()
            $reader.Dispose()
            $id = $manifest.Package.Identity
            "msix identity: Name=$($id.Name) Version=$($id.Version) ProcessorArchitecture=$($id.ProcessorArchitecture) Publisher=$($id.Publisher)"
            if ($id.ProcessorArchitecture -ne $env:ARCH) { throw "msix ProcessorArchitecture is $($id.ProcessorArchitecture)" }
            if ($id.Name -ne 'Dhiva-Labs.DoseDrop') { throw "msix identity is $($id.Name)" }
            $tmp = Join-Path $env:RUNNER_TEMP 'msix_dose_drop.exe'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($msix.GetEntry('dose_drop.exe'), $tmp, $true)
            $m = Get-PeMachine $tmp
            'msix: dose_drop.exe 0x{0:X4}' -f $m
            if ($m -ne $expected) { throw 'msix holds the wrong architecture' }
          } finally { $msix.Dispose() }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.msix
          if-no-files-found: error

  snap:
    name: Snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: snapcore/action-build@v1
        id: build

      - name: Assert the snap is ${{ matrix.arch }}
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          ls -l "$SNAP_FILE"
          case "$SNAP_FILE" in
            *_${{ matrix.arch }}.snap) ;;
            *) echo "::error::unexpected snap file name $SNAP_FILE"; exit 1 ;;
          esac
          command -v unsquashfs > /dev/null || sudo apt-get install -y squashfs-tools
          unsquashfs -q -d "$RUNNER_TEMP/snap" "$SNAP_FILE" meta/snap.yaml dose_drop
          sed -n '/^architectures:/,/^[a-z]/p' "$RUNNER_TEMP/snap/meta/snap.yaml"
          grep -qx -- '- ${{ matrix.arch }}' "$RUNNER_TEMP/snap/meta/snap.yaml"
          file "$RUNNER_TEMP/snap/dose_drop" | tee /dev/stderr | grep -q "$ELF_MACHINE"

      # Installs the snap built above under strict confinement (snapd pulls in
      # the gnome-42-2204 content snap) and starts it under Xvfb. The GTK
      # runner maps the window after Flutter's first frame and the Dart code
      # titles it "DoseDrop", so a visible "DoseDrop" window shows the confined
      # app runs on this architecture with the content snap's GTK and Mesa.
      # -ac: a confined snap cannot read xvfb-run's X authority file.
      - name: Install the snap and run it confined (Xvfb)
        timeout-minutes: 15
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo apt-get install -y xvfb xauth xdotool
          sudo snap install --dangerous "$SNAP_FILE"
          snap list
          snap connections dosedrop
          cat > "$RUNNER_TEMP/snap-smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/snap-smoke.log"
          snap run dosedrop > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            if xdotool search --onlyvisible --name '^DoseDrop$' > /dev/null 2>&1; then
              echo "DoseDrop window is up after ${i}s"
              sleep 5
              kill -0 "$pid" || { echo "dosedrop died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "dosedrop exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no DoseDrop window after 120s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24 -ac" bash "$RUNNER_TEMP/snap-smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  # Repackages each architecture's .deb for Fedora/RHEL/openSUSE (.rpm),
  # Arch (.pkg.tar.zst) and any glibc distribution (AppImage), then installs
  # every one of them on the real distribution and runs it there: ldd of
  # every ELF file, aplay on the alarm sound, and the app under Xvfb until
  # the Dart code has titled its window and created the data folder.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: deb

      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64; ai_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; ai_arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-$ai_arch.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The AppImage and the Flatpak carry the tray icon's libraries and
      # aplay from this machine (BUNDLE_LIBS/BUNDLE_BINS in distro.conf):
      # the same Ubuntu packages the .deb depends on.
      - name: Install the libraries and tools to bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-1 alsa-utils

      # One installed tree, the .deb's, for every format. The Flatpak job
      # gets the same cleaned tree (tar keeps modes and symlinks).
      - name: Build .rpm, Arch package and AppImage
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          dpkg-deb -x "deb/dosedrop_${VERSION}-1_${{ matrix.deb_arch }}.deb" "$RUNNER_TEMP/root"
          VERSION="$VERSION" TREE_TARBALL="$RUNNER_TEMP/tree.tar.xz" \
            packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb_arch }} dist

      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree.tar.xz
          if-no-files-found: error
          retention-days: 3

  # AUR recipe: PKGBUILD + .SRCINFO for dosedrop-bin, rendered with this
  # build's checksums and proven with makepkg on archlinux:latest.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: debs
          merge-multiple: true

      - name: Render and check the PKGBUILD
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          VERSION="$VERSION" packaging/arch/aur.sh \
            "debs/dosedrop_${VERSION}-1_amd64.deb" "debs/dosedrop_${VERSION}-1_arm64.deb" dist

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # Builds the Flatpak from the same tree, installs the bundle and runs it in
  # the sandbox: ldd of every ELF file against the GNOME runtime, the
  # bundled aplay on the alarm sound, and the app under Xvfb until the Dart
  # code has titled its window and created the data folder.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [distros]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, fp_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, fp_arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      APP_ID: com.dhivalabs.dose_drop
    steps:
      - uses: actions/checkout@v7

      # A workspace path: inside a container job, runner.temp names the
      # host's directory, not the container's $RUNNER_TEMP.
      - uses: actions/download-artifact@v8
        with:
          name: tree-${{ matrix.arch }}
          path: flatpak-tree

      # The metainfo's newest <release> must be this version, or software
      # centres show a stale one.
      - name: Unpack the installed tree
        id: v
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          grep -F "<release version=\"$VERSION\"" "packaging/flatpak/$APP_ID.metainfo.xml" ||
            { echo "::error::add <release version=\"$VERSION\" .../> to packaging/flatpak/$APP_ID.metainfo.xml"; exit 1; }
          mkdir -p packaging/flatpak/tree
          tar -xJf flatpak-tree/tree.tar.xz -C packaging/flatpak/tree
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/${{ env.APP_ID }}.yml
          bundle: dosedrop-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak
          artifact-name: flatpak-${{ matrix.arch }}
          arch: ${{ matrix.fp_arch }}
          cache: false

      - name: Install the bundle and run it
        timeout-minutes: 10
        env:
          BUNDLE: dosedrop-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak
        run: |
          flatpak install -y --noninteractive --bundle "$BUNDLE"
          flatpak info "$APP_ID"
          flatpak info --show-permissions "$APP_ID"

          # Every ELF file in /app must find all of its libraries in the
          # runtime or next to it.
          flatpak run --command=bash "$APP_ID" -c '
            set -euo pipefail
            mapfile -d "" elfs < <(find /app -type f -print0)
            n=0; bad=0
            for f in "${elfs[@]}"; do
              [ "$(head -c 4 "$f" | od -An -tx1 | tr -d " \n")" = 7f454c46 ] || continue
              n=$((n + 1))
              if LD_LIBRARY_PATH=/app/lib/dosedrop/lib ldd "$f" | grep "not found"; then
                echo "missing libraries for $f"; bad=1
              fi
            done
            echo "$n ELF files checked with ldd"
            [ "$bad" = 0 ] && [ "$n" -ge 12 ]
          '

          # The alarm: the app runs `aplay` on the sound it bundles (ALSA's
          # null device here, as the container has no sound card).
          flatpak run --command=aplay "$APP_ID" -D null \
            /app/lib/dosedrop/data/flutter_assets/assets/sounds/alarm.wav

          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOS'
          log="$RUNNER_TEMP/flatpak-smoke.log"
          flatpak run "$APP_ID" > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            kill -0 "$pid" 2> /dev/null || { echo "the app exited early"; cat "$log"; exit 1; }
            if python3 packaging/flatpak/x11_window.py '^DoseDrop$' &&
               [ -d "$HOME/.var/app/$APP_ID/data/com.dhivalabs.dose_drop" ] && [ "$i" -ge 20 ]; then
              echo "still running after ${i}s; data folder:"
              ls -la "$HOME/.var/app/$APP_ID/data/com.dhivalabs.dose_drop"
              kill "$pid"
              cat "$log"
              if grep -E 'error while loading shared libraries|cannot open shared object|undefined symbol' "$log"; then exit 1; fi
              exit 0
            fi
            sleep 1
          done
          echo "no DoseDrop window and data folder after 90s"
          find "$HOME/.var/app" -maxdepth 4
          cat "$log"
          exit 1
          EOS
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

  # Collects the tarballs, .debs, Windows zips and other-distribution
  # packages of both architectures on every run, so the selection below is
  # checked on pull requests too. When a
  # release is published it attaches whichever of them the release does not
  # have yet: a file uploaded by hand under the same name is left as it is.
  release:
    name: Release assets
    needs: [linux, windows, distros, aur, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'windows-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'distros-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'flatpak-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: assets

      - name: Select the release assets
        id: select
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          FILES=""
          for arch in x64 arm64; do
            case "$arch" in x64) deb_arch=amd64; m=x86_64 ;; arm64) deb_arch=arm64; m=aarch64 ;; esac
            FILES="$FILES assets/DoseDrop-${VERSION}-linux-${arch}.tar.gz"
            FILES="$FILES assets/dosedrop_${VERSION}-1_${deb_arch}.deb"
            FILES="$FILES assets/DoseDrop-${VERSION}-windows-${arch}.zip"
            FILES="$FILES assets/dosedrop-${VERSION}-1.${m}.rpm assets/dosedrop-${VERSION}-1-${m}.pkg.tar.zst"
            FILES="$FILES assets/DoseDrop-${VERSION}-${m}.AppImage assets/dosedrop-${VERSION}-${m}.flatpak"
          done
          FILES="$FILES assets/dosedrop-bin-${VERSION}-aur.tar.gz"
          ls -l assets
          ls -l $FILES
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Upload to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.select.outputs.version }}
          FILES: ${{ steps.select.outputs.files }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in $FILES; do
            name="$(basename "$f")"
            if grep -qxF -- "$name" <<< "$existing"; then
              echo "$name is already on release $TAG, leaving it as it is"
            else
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
